[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kline-hunter"
version = "0.1.0"
description = "K线智能筛选定位器：自然语言选股 + 全市场K线扫描 + 通达信定位"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "PyQt6>=6.6",
    "openpyxl>=3.1",
    "pytdx>=1.72",
    "openai>=1.30",
    "pywin32>=306; sys_platform == 'win32'",
    "pyautogui>=0.9.54; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
kline-hunter = "kline_hunter.gui.app:run"
kline-hunter-cli = "kline_hunter.cli:main"

[tool.setuptools.packages.find]
include = ["kline_hunter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
